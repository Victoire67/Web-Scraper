[project]
name = "web-scraper"
version = "0.1.0"
description = ""
authors = [
    {name = "victoire67",email = "ansimavicky@gmail.com"}
]
requires-python = ">3.11"
dependencies = [
    "aiohttp (>=3.13,<3.14)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "requests (>=2.34.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "aioresponses (>=0.7.9,<0.8.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
